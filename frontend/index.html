<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A modern notes application with dark/light theme support.">
  <title>EasyNotes — Organize Your Thoughts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="ambient-bg"><div class="orb orb-1"></div><div class="orb orb-2"></div><div class="orb orb-3"></div></div>

  <div class="app">
    <header class="header">
      <div class="header-inner">
        <div class="logo">
          <div class="logo-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </div>
          <h1>EasyNotes</h1>
        </div>
        <div class="header-actions">
          <div class="search-wrapper">
            <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" class="search-input" placeholder="Search notes..." autocomplete="off">
            <button class="search-clear" id="search-clear" aria-label="Clear search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
          <button class="btn-theme" id="btn-theme" aria-label="Toggle theme">
            <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          </button>
          <button class="btn-add" id="btn-add-note" aria-label="Add new note">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            <span>New Note</span>
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <div class="notes-count" id="notes-count"></div>
      <div class="notes-grid" id="notes-grid"></div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <div class="empty-illustration">
          <svg width="100" height="100" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.3"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <h2>No notes yet</h2>
        <p>Click <strong>+ New Note</strong> to get started</p>
      </div>
    </main>
  </div>

  <!-- Note Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="note-modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">New Note</h2>
        <button class="modal-close" id="modal-close" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="note-form">
        <div class="form-group">
          <label for="note-title-input">Title</label>
          <input type="text" id="note-title-input" placeholder="Note title..." required maxlength="100">
        </div>
        <div class="form-group">
          <label for="note-content-input">Content</label>
          <textarea id="note-content-input" placeholder="Write something..." rows="5" maxlength="5000"></textarea>
        </div>
        <div class="form-group">
          <label>Color</label>
          <div class="color-picker" id="color-picker">
            <button type="button" class="color-swatch active" data-color="#6C63FF" style="background:#6C63FF"></button>
            <button type="button" class="color-swatch" data-color="#FF6584" style="background:#FF6584"></button>
            <button type="button" class="color-swatch" data-color="#43E97B" style="background:#43E97B"></button>
            <button type="button" class="color-swatch" data-color="#F7971E" style="background:#F7971E"></button>
            <button type="button" class="color-swatch" data-color="#00D2FF" style="background:#00D2FF"></button>
            <button type="button" class="color-swatch" data-color="#FC5C7D" style="background:#FC5C7D"></button>
            <button type="button" class="color-swatch" data-color="#A18CD1" style="background:#A18CD1"></button>
            <button type="button" class="color-swatch" data-color="#FDCB6E" style="background:#FDCB6E"></button>
          </div>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save">Save Note</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="delete-overlay">
    <div class="modal modal-delete">
      <div class="delete-icon-wrap">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#FF6584" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      </div>
      <h2>Delete Note?</h2>
      <p>This action cannot be undone.</p>
      <div class="form-actions center">
        <button class="btn btn-secondary" id="btn-delete-cancel">Cancel</button>
        <button class="btn btn-danger" id="btn-delete-confirm">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"><span id="toast-message"></span></div>
  <script src="app.js"></script>
</body>
</html>
